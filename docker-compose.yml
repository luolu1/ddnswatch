services:
  ddnswatch:
    build: .
    ports:
      - "${DDNSWATCH_PORT:-8000}:8000"
    environment:
      DDNSWATCH_CONFIG: /app/data/config.yaml
      DDNSWATCH_DATABASE_PATH: /app/data/ddnswatch.sqlite3
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
